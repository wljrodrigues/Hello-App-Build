<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <!-- 🔥 ESSENCIAL para apps mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>BUSCAS - Explorador de Camadas</title>

    <!-- ✅ Caminhos corrigidos -->
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./assets/leaflet/leaflet.css">

    <!-- 🌐 fallback CDN (caso não tenha local) -->
    <!-- <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /> -->

</head>
<body>

    <!-- 🔥 Splash / Loading -->
    <div id="app-loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Carregando aplicação...</p>
        </div>
    </div>

    <!-- 📡 Tela offline -->
    <div id="offline-screen" style="display:none;">
        <div class="offline-box">
            <h2>📡 Sem conexão</h2>
            <p>Verifique sua internet e tente novamente.</p>
            <button onclick="retryConnection()">Tentar novamente</button>
        </div>
    </div>

    <!-- ✅ App -->
    <div id="app" style="display:none;">
        <div class="container">
            <header class="header">
                <h1>BUSCAS - Explorador de Camadas</h1>
                <p>Explore e baixe camadas do servidor WMS público</p>
            </header>

            <!-- (resto do seu HTML permanece igual) -->

        </div>
    </div>

</body>
</html>
