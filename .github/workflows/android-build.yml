name: Android Build (HTML PRO - Blindado v4 - MonoCrossOver)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: MonoCrossOver
      APP_ID: com.monocrossover.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔍 Validar projeto
      - name: Check index.html
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ index.html não encontrado!"
            exit 1
          fi

      # 📁 Copiar arquivos limpos
      - name: Prepare clean web assets
        run: |
          mkdir www
          rsync -av ./ www/ \
            --exclude node_modules \
            --exclude .git \
            --exclude android \
            --exclude www \
            --exclude .github \
            --exclude package.json \
            --exclude package-lock.json

      # ⚙️ Setup Capacitor
      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          npx cap init "$APP_NAME" "$APP_ID" --web-dir "www"
          npx cap add android

      # 🎨 Gerar ícones e splash
      - name: Generate icons and splash
        run: |
          if [ -d "assets" ]; then
            echo "🎨 Gerando assets..."
            npx @capacitor/assets generate --android
          else
            echo "⚠️ Pasta assets não encontrada"
          fi

      # 🔄 Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔐 Validar secret
      - name: Validate KEYSTORE_BASE64
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ SECRET KEYSTORE_BASE64 não definido!"
            exit 1
          fi

      # 🔐 Keystore
      - name: Setup Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

          SIZE=$(stat -c%s android/app/keystore.jks)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ Keystore inválida!"
            exit 1
          fi

          echo "✅ Keystore OK ($SIZE bytes)"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 🎨 Cor do app
      - name: Customize colors
        run: |
          sed -i 's/#6200ee/#0f172a/g' android/app/src/main/res/values/colors.xml || true

      # 🔍 Debug
      - name: Debug files
        run: ls -la android/app

      # 🚀 Build AAB (PLAY STORE)
      - name: Build AAB (Release)
        working-directory: android
        run: |
          KEYSTORE_PATH=$(realpath app/keystore.jks)

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 🚀 Build APK (opcional)
      - name: Build APK (Release)
        working-directory: android
        run: |
          KEYSTORE_PATH=$(realpath app/keystore.jks)

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 📦 Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # 📦 Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk