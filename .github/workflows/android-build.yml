name: Android Build (HTML Puro)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: MeuApp
      APP_ID: com.meuapp.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔹 Node (necessário pro Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🔹 Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🔹 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔥 Criar package.json (sempre, HTML puro precisa)
      - name: Init Node project
        run: npm init -y

      # 🔥 Instalar Capacitor
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli

      # 🔍 Garantir que existe index.html
      - name: Check index.html
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ index.html não encontrado na raiz!"
            exit 1
          fi

      # 🧠 Criar config do Capacitor
      - name: Create capacitor config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF

      # 📱 Inicializar Capacitor
      - name: Init Capacitor
        run: npx cap init "$APP_NAME" "$APP_ID" --web-dir "."

      # 📱 Adicionar Android
      - name: Add Android platform
        run: npx cap add android

      # 🔄 Sync
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔐 Keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 🔢 Versionamento automático
      - name: Set version code
        run: |
          VERSION_CODE=$(date +%s)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Update version in Gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle || true

      # 🚀 Build AAB
      - name: Build AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 🚀 Build APK
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 📦 Upload
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
