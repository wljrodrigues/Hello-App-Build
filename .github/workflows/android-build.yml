name: Android Build PRO (Play Store Ready)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: MonoCrossOver
      APP_ID: com.monocrossover.app

    steps:

      # ============================================
      # 🚀 CHECKOUT
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 🟢 NODE
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================
      # ☕ JAVA
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================
      # 🤖 ANDROID SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # 🔍 VALIDAR HTML
      # ============================================
      - name: Validate project
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ index.html não encontrado"
            exit 1
          fi

      # ============================================
      # 📁 PREPARAR WWW
      # ============================================
      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www

          rsync -av ./ www/ \
            --exclude node_modules \
            --exclude .git \
            --exclude android \
            --exclude www \
            --exclude .github \
            --exclude package.json \
            --exclude package-lock.json

          echo "✅ Arquivos preparados"

      # ============================================
      # 📦 PACKAGE.JSON LIMPO
      # ============================================
      - name: Create package.json
        run: |
          cat > package.json <<EOF
          {
            "name": "android-app",
            "version": "1.0.0",
            "private": true
          }
          EOF

      # ============================================
      # ⚙️ INSTALAR CAPACITOR
      # ============================================
      - name: Install Capacitor
        run: |
          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets

      # ============================================
      # ⚙️ CRIAR CAPACITOR CONFIG
      # ============================================
      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.ts <<EOF
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: '${APP_ID}',
            appName: '${APP_NAME}',
            webDir: 'www',
            bundledWebRuntime: false,
            android: {
              allowMixedContent: true
            }
          };

          export default config;
          EOF

      # ============================================
      # 🤖 ADD ANDROID
      # ============================================
      - name: Add Android Platform
        run: |
          npx cap add android

      # ============================================
      # 🎨 GENERATE ICONS & SPLASH (AUTO DETECT)
      # ============================================
      - name: Generate Assets
        run: |

          echo "🔍 Procurando assets..."  

    find . -iname "icon.png"
    find . -iname "splash.png"

    ICON=$(find . -iname "icon.png" | head -n 1)
    SPLASH=$(find . -iname "splash.png" | head -n 1)

    if [ -z "$ICON" ]; then
      echo "⚠️ icon.png não encontrado"
    else
      echo "✅ ICON: $ICON"
    fi

    if [ -z "$SPLASH" ]; then
      echo "⚠️ splash.png não encontrado"
    else
      echo "✅ SPLASH: $SPLASH"
    fi

    mkdir -p assets

    if [ ! -z "$ICON" ]; then
      cp "$ICON" assets/icon.png
    fi

    if [ ! -z "$SPLASH" ]; then
      cp "$SPLASH" assets/splash.png
    fi

    ls -la assets

    if [ -f "assets/icon.png" ] || [ -f "assets/splash.png" ]; then
      echo "🎨 Gerando assets Android..."
      npx @capacitor/assets generate --android
    else
      echo "⚠️ Nenhum asset encontrado"
    fi

      # ============================================
      # 🔄 SYNC
      # ============================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ============================================
      # 🔐 VALIDAR SECRETS
      # ============================================
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ KEYSTORE_BASE64 ausente"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "❌ KEY_ALIAS ausente"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "❌ KEY_PASSWORD ausente"
            exit 1
          fi

          if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "❌ STORE_PASSWORD ausente"
            exit 1
          fi

          echo "✅ Secrets OK"

      # ============================================
      # 🔐 DECODE KEYSTORE
      # ============================================
      - name: Setup Keystore
        run: |
          mkdir -p android/app

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

          if [ ! -f android/app/keystore.jks ]; then
            echo "❌ Falha ao criar keystore"
            exit 1
          fi

          SIZE=$(stat -c%s android/app/keystore.jks)

          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ Keystore inválida"
            exit 1
          fi

          echo "✅ Keystore OK ($SIZE bytes)"

      # ============================================
      # 🔢 VERSIONAMENTO AUTOMÁTICO
      # ============================================
      - name: Update Version Code
        run: |
          VERSION_CODE=$(date +%s)
          VERSION_NAME="1.$(date +%Y%m%d).$(date +%H%M)"

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          echo "📦 VERSION_CODE=$VERSION_CODE"
          echo "📦 VERSION_NAME=$VERSION_NAME"

      # ============================================
      # 🛠️ PATCH BUILD.GRADLE
      # ============================================
      - name: Patch build.gradle
        run: |
          sed -i "s/versionCode.*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      # ============================================
      # 🔧 GRADLE EXECUTABLE
      # ============================================
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ============================================
      # 🚀 BUILD AAB
      # ============================================
      - name: Build AAB
        working-directory: android
        run: |
          KEYSTORE_PATH=$(realpath app/keystore.jks)

          echo "📁 Keystore: $KEYSTORE_PATH"

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ============================================
      # 🚀 BUILD APK
      # ============================================
      - name: Build APK
        working-directory: android
        run: |
          KEYSTORE_PATH=$(realpath app/keystore.jks)

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ============================================
      # 📦 UPLOAD AAB
      # ============================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # ============================================
      # 📦 UPLOAD APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk