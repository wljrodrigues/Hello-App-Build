name: Android Build (HTML PRO - Blindado v3)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: MeuApp
      APP_ID: com.meuapp.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔍 Validar projeto
      - name: Check index.html
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ index.html não encontrado!"
            exit 1
          fi

      # 📁 Copiar arquivos limpos
      - name: Prepare clean web assets
        run: |
          mkdir www
          rsync -av ./ www/ \
            --exclude node_modules \
            --exclude .git \
            --exclude android \
            --exclude www \
            --exclude .github \
            --exclude package.json \
            --exclude package-lock.json

      # ⚙️ Setup Capacitor
      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          npx cap init "$APP_NAME" "$APP_ID" --web-dir "www"
          npx cap add android

      # 🎨 Gerar ícone e splash automaticamente
      - name: Generate icons and splash
        run: |
          if [ -d "assets" ]; then
            echo "🎨 Gerando ícones e splash..."
            npx @capacitor/assets generate --android
          else
            echo "⚠️ Pasta assets não encontrada, pulando..."
          fi

      # 🔄 Sync após assets (ORDEM CORRETA)
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔐 Validar SECRET antes de usar
      - name: Validate KEYSTORE_BASE64
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ ERRO: SECRET KEYSTORE_BASE64 não está definido!"
            exit 1
          else
            echo "✅ SECRET KEYSTORE_BASE64 carregado"
          fi

      # 🔐 Keystore blindada
      - name: Setup Keystore (Validate + Safe)
        run: |
          echo "🔐 Decodificando keystore..."

          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

          if [ ! -f "android/app/keystore.jks" ]; then
            echo "❌ Keystore não encontrada!"
            exit 1
          fi

          SIZE=$(stat -c%s android/app/keystore.jks)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ Keystore inválida ou vazia!"
            exit 1
          fi

          echo "✅ Keystore válida ($SIZE bytes)"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 🎨 Customização visual (cores do app)
      - name: Customize app colors
        run: |
          sed -i 's/#6200ee/#0f172a/g' android/app/src/main/res/values/colors.xml || true

      # 🔍 Debug opcional
      - name: Debug files
        run: |
          echo "📂 android/app:"
          ls -la android/app

      # 🚀 Build APK (ABSOLUTE PATH FIX)
      - name: Build APK (Final Safe)
        working-directory: android
        run: |
          echo "🚀 Iniciando build..."

          KEYSTORE_PATH=$(realpath app/keystore.jks)

          echo "📁 Keystore: $KEYSTORE_PATH"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "❌ ERRO: Keystore não encontrada!"
            exit 1
          fi

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 📦 Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
