name: Android Build (Universal - Play Store Ready)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: MeuApp
      APP_ID: com.meuapp.app

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 🟢 NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ☕ JAVA
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🤖 ANDROID
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 📦 INSTALL DEPENDÊNCIAS
      - name: Install dependencies
        run: npm install

      # 🏗 BUILD VITE (CRÍTICO)
      - name: Build project
        run: npm run build

      # 🔍 VALIDAÇÃO
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Pasta dist não encontrada!"
            exit 1
          fi

      # 📁 PREPARAR WWW
      - name: Prepare web assets
        run: |
          mkdir www
          rsync -av ./dist/ www/

      # ⚙️ CAPACITOR
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/dialog @capacitor/toast @capacitor/share @capacitor/filesystem

          npx cap init "$APP_NAME" "$APP_ID" --web-dir "www"
          npx cap add android

      # 🎨 ICONES
      - name: Generate icons
        run: |
          if [ -d "assets" ]; then
            npm install @capacitor/assets
            npx @capacitor/assets generate --android
          fi

      # 🔄 SYNC
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔐 VALIDAR KEYSTORE
      - name: Validate Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ KEYSTORE_BASE64 não definido"
            exit 1
          fi

      # 🔐 CONFIGURAR KEYSTORE
      - name: Setup Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # 🔧 PERMISSÃO
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 🎨 CUSTOMIZAÇÃO
      - name: Customize App
        run: |
          sed -i 's/#6200ee/#0f172a/g' android/app/src/main/res/values/colors.xml || true

      # 🚀 BUILD AAB
      - name: Build AAB
        working-directory: android
        run: |
          KEYSTORE_PATH=$(realpath app/keystore.jks)

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 🚀 BUILD APK
      - name: Build APK
        working-directory: android
        run: |
          KEYSTORE_PATH=$(realpath app/keystore.jks)

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 📦 UPLOAD AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # 📦 UPLOAD APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk