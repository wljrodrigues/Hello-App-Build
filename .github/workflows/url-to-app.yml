name: URL to Android App PRO (NO IFRAME - Play Store Ready)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome do App"
        required: true
        default: "MeuApp"
      app_id:
        description: "com.meuapp.app"
        required: true
        default: "com.meuapp.app"
      app_url:
        description: "URL do site"
        required: true
        default: "https://google.com"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      APP_ID: ${{ github.event.inputs.app_id }}
      APP_URL: ${{ github.event.inputs.app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # 📁 Criar estrutura correta
      - name: Create Web App (SAFE)
        run: |
          mkdir -p app/www
          cd app/www

          cat <<EOF > index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${APP_NAME}</title>
          </head>
          <body>
            <h3 style="text-align:center;margin-top:40px;">
              Carregando aplicativo...
            </h3>
          </body>
          </html>
          EOF

      # ⚙️ Setup Capacitor CORRETO
      - name: Setup Capacitor
        run: |
          cd app

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "$APP_NAME" "$APP_ID" --web-dir "www"

          npx cap add android
          npx cap sync android

      # 🔥 WebView nativa (SEM IFRAME)
      - name: Configure Native WebView (PRO)
        run: |
          FILE=$(find app/android -name MainActivity.java)

          PACKAGE=$(grep -oP 'package\s+\K[^;]+' $FILE)

          echo "📄 Editando: $FILE"

          cat <<EOF > $FILE
          package $PACKAGE;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = this.bridge.getWebView();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("${APP_URL}");
              }

              @Override
              public void onBackPressed() {
                  WebView webView = this.bridge.getWebView();
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # 🌐 Permissão internet
      - name: Enable Internet
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n<application/' app/android/app/src/main/AndroidManifest.xml

      # 🔐 Validar SECRET
      - name: Validate KEYSTORE
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ KEYSTORE_BASE64 não definido"
            exit 1
          fi

      # 🔐 Setup Keystore
      - name: Setup Keystore
        run: |
          mkdir -p app/android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/app/keystore.jks

          SIZE=$(stat -c%s app/android/app/keystore.jks)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ Keystore inválida"
            exit 1
          fi

      - name: Make Gradle executable
        run: chmod +x app/android/gradlew

      # 🚀 Build AAB
      - name: Build AAB
        working-directory: app/android
        run: |
          KEYSTORE=$(realpath app/keystore.jks)

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 🚀 Build APK
      - name: Build APK
        working-directory: app/android
        run: |
          KEYSTORE=$(realpath app/keystore.jks)

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 📦 Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab

      # 📦 Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/android/app/build/outputs/apk/release/*.apk

