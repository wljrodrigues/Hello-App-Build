name: Android Build (HTML SaaS PRO - Branding AUTO)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ID: com.meuapp.app
      APP_URL: https://editoraitacaiunas.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔧 Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick rsync

      # =========================================
      # 🎨 BRANDING AUTOMÁTICO (SaaS CORE)
      # =========================================
      - name: Generate Branding
        run: |
          echo "🚀 Gerando branding automático..."

          mkdir -p assets

          curl -L "$APP_URL" -o page.html || true

          # 🧾 Nome
          TITLE=$(grep -oP '(?<=<title>).*?(?=</title>)' page.html | head -n 1)
          if [ -z "$TITLE" ]; then TITLE="Meu App"; fi

          echo "APP_NAME=$TITLE" >> $GITHUB_ENV
          echo "📱 Nome: $TITLE"

          # 🖼️ Logo
          LOGO=$(grep -oP '(?<=property="og:image" content=")[^"]+' page.html | head -n 1)

          if [ ! -z "$LOGO" ]; then
            curl -L "$LOGO" -o logo.png
          else
            DOMAIN=$(echo $APP_URL | awk -F/ '{print $3}')
            curl -L "$APP_URL/favicon.ico" -o logo.png || true
            if [ ! -s logo.png ]; then
              curl -L "https://www.google.com/s2/favicons?sz=512&domain=$DOMAIN" -o logo.png
            fi
          fi

          if [ ! -s logo.png ]; then
            echo "❌ Não foi possível obter logo"
            exit 1
          fi

          # 🎨 Icon
          convert logo.png -resize 1024x1024 assets/icon.png

          # 🎯 Cor dominante
          COLOR=$(convert assets/icon.png -scale 1x1\! -format '%[hex:p{0,0}]' info:)
          echo "APP_COLOR=#${COLOR}" >> $GITHUB_ENV
          echo "🎨 Cor: #${COLOR}"

          # 🌊 Splash
          convert -size 2732x2732 canvas:"#${COLOR}" \
            -gravity center assets/icon.png \
            -resize 512x512 \
            -composite assets/splash.png

          echo "✅ Branding pronto"
          ls -la assets

      # =========================================
      # 📁 PREPARAR HTML
      # =========================================
      - name: Prepare web assets
        run: |
          mkdir www
          rsync -av ./ www/ \
            --exclude node_modules \
            --exclude .git \
            --exclude android \
            --exclude www \
            --exclude .github \
            --exclude package.json \
            --exclude package-lock.json

      # =========================================
      # ⚙️ CAPACITOR (SEM ERROS)
      # =========================================
      - name: Setup Capacitor
        run: |
          mkdir app
          cd app

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          cat <<EOF > capacitor.config.json
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # copiar web
          cp -r ../www ./www

          npx cap add android

      # 🎨 Gerar assets Android
      - name: Generate Android Assets
        run: |
          cd app
          cp -r ../assets .
          npx @capacitor/assets generate --android

      # 🔄 Sync
      - name: Sync Capacitor
        run: |
          cd app
          npx cap sync android

      # 🎨 Aplicar cor no Android
      - name: Apply Theme Color
        run: |
          sed -i "s/#6200ee/${{ env.APP_COLOR }}/g" app/android/app/src/main/res/values/colors.xml || true

      # =========================================
      # 🔐 KEYSTORE AUTO (SE NÃO EXISTIR)
      # =========================================
      - name: Setup Keystore
        run: |
          cd app/android/app

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ Gerando keystore automática..."

            keytool -genkey -v \
              -keystore keystore.jks \
              -storepass android \
              -keypass android \
              -alias app \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=App,O=Company,C=BR"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          fi

      - name: Make Gradle executable
        run: chmod +x app/android/gradlew

      # =========================================
      # 🚀 BUILD APK
      # =========================================
      - name: Build APK
        working-directory: app/android
        run: |
          KEYSTORE=$(realpath app/keystore.jks)

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD || 'android' }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS || 'app' }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD || 'android' }}

      # =========================================
      # 🚀 BUILD AAB (PLAY STORE)
      # =========================================
      - name: Build AAB
        working-directory: app/android
        run: |
          KEYSTORE=$(realpath app/keystore.jks)

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD || 'android' }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS || 'app' }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD || 'android' }}

      # =========================================
      # 📦 UPLOAD
      # =========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab